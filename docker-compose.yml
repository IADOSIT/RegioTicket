# RegioTicket — iaDoS · iados.mx
# VPS: usa web_network existente, postgres_local externo, Redis propio
# Puertos ocupados en host: 5010, 8088 — NO usarlos
# Rollback: git checkout <commit> && docker compose up --build -d

services:

  regioticket_nginx:
    build:
      context: ./nginx
      dockerfile: Dockerfile
    container_name: regioticket_nginx
    restart: unless-stopped
    ports:
      - "8089:80"
    networks:
      - web_network
    dns:
      - 8.8.8.8
      - 1.1.1.1
    depends_on:
      - regioticket_web
      - regioticket_api

  regioticket_web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: regioticket_web
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - NEXTAUTH_URL=https://regioticket.iados.online
      - NEXTAUTH_SECRET=b8745b90b3972fd6d3123fbed527b50e246d57c9b08873ad09b9f44d67ace7a4
      - NEXT_PUBLIC_API_URL=https://regioticket.iados.online/api
      - API_INTERNAL_URL=http://regioticket_api:4000
      - NEXT_PUBLIC_BASE_DOMAIN=regioticket.iados.online
    networks:
      - web_network
    dns:
      - 8.8.8.8
      - 1.1.1.1
    depends_on:
      - regioticket_api

  regioticket_api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: regioticket_api
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - PORT=4000
      - DATABASE_URL=postgresql://administrador:U191tl1ebFN2RJR0fld5QhC8U29AhdOQ@postgres_local:5432/regioticket
      - REDIS_URL=redis://regioticket_redis:6379
      - JWT_SECRET=fffe8a4f50dfc513839f1a12a3fa3aac6ccc0cfaed3dda87232fba76348f9a2e
      - NEXTAUTH_URL=https://regioticket.iados.online
      - MP_ACCESS_TOKEN=TEST_ACCESS_TOKEN
      - MP_WEBHOOK_SECRET=TEST_WEBHOOK_SECRET
      - SMTP_HOST=smtp.gmail.com
      - SMTP_PORT=587
      - SMTP_USER=correo@gmail.com
      - SMTP_PASS=app_password_aqui
    networks:
      - web_network
    dns:
      - 8.8.8.8
      - 1.1.1.1
    depends_on:
      - regioticket_redis

  regioticket_redis:
    image: redis:7-alpine
    container_name: regioticket_redis
    restart: unless-stopped
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru --appendonly yes
    volumes:
      - regioticket_redis_data:/data
    networks:
      - web_network
    dns:
      - 8.8.8.8
      - 1.1.1.1

volumes:
  regioticket_redis_data:
    name: regioticket_redis_data

networks:
  web_network:
    external: true
