<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Green rounded background -->
  <rect width="32" height="32" rx="7" fill="#16a34a"/>
  <!-- Outer hexagon - thin white stroke -->
  <polygon points="16,2.5 27.5,8.75 27.5,23.25 16,29.5 4.5,23.25 4.5,8.75"
           fill="none" stroke="white" stroke-width="1.4" stroke-linejoin="round"/>
  <!-- Inner hexagon - subtler -->
  <polygon points="16,9.5 22.5,13.25 22.5,18.75 16,22.5 9.5,18.75 9.5,13.25"
           fill="none" stroke="white" stroke-width="1" stroke-linejoin="round" stroke-opacity="0.6"/>
  <!-- Spokes outer→inner -->
  <line x1="16" y1="2.5"  x2="16" y2="9.5"   stroke="white" stroke-width="1" stroke-opacity="0.6"/>
  <line x1="27.5" y1="8.75"  x2="22.5" y2="13.25" stroke="white" stroke-width="1" stroke-opacity="0.6"/>
  <line x1="27.5" y1="23.25" x2="22.5" y2="18.75" stroke="white" stroke-width="1" stroke-opacity="0.6"/>
  <line x1="16" y1="29.5" x2="16" y2="22.5"  stroke="white" stroke-width="1" stroke-opacity="0.6"/>
  <line x1="4.5" y1="23.25" x2="9.5" y2="18.75" stroke="white" stroke-width="1" stroke-opacity="0.6"/>
  <line x1="4.5" y1="8.75"  x2="9.5" y2="13.25" stroke="white" stroke-width="1" stroke-opacity="0.6"/>
  <!-- Center dot -->
  <circle cx="16" cy="16" r="2" fill="white"/>
</svg>
