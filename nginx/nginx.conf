# Nginx reverse proxy RegioTicket
# / → web:3000 (Next.js)
# /api/ → api:4000 (Express)

events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;

  sendfile on;
  keepalive_timeout 65;
  client_max_body_size 10m;

  # Buffer para SSE y PDFs
  proxy_buffering off;

  upstream web_app {
    server regioticket_web:3000;
    keepalive 16;
  }

  upstream api_app {
    server regioticket_api:4000;
    keepalive 16;
  }

  server {
    listen 80;
    server_name _;

    # SSE y streaming — no buffer, timeout largo
    location /api/eventos/ {
      proxy_pass http://api_app;
      proxy_http_version 1.1;
      proxy_set_header Connection '';
      proxy_read_timeout 120s;
      proxy_buffering off;
      proxy_cache off;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
    }

    # Admin dashboard SSE
    location /api/admin/dashboard/ {
      proxy_pass http://api_app;
      proxy_http_version 1.1;
      proxy_set_header Connection '';
      proxy_read_timeout 120s;
      proxy_buffering off;
      proxy_cache off;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
    }

    # PDF y webhook — timeout extendido
    location ~ ^/api/(boletos/.*/pdf|boletos/.*/ticket-termico|webhook) {
      proxy_pass http://api_app;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Signature $http_x_signature;
      proxy_set_header X-Request-Id $http_x_request_id;
      proxy_read_timeout 120s;
    }

    # Resto de la API
    location /api/ {
      proxy_pass http://api_app;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_read_timeout 30s;
    }

    # Next.js — con soporte WebSocket para HMR en dev y SSE del cliente
    location / {
      proxy_pass http://web_app;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_read_timeout 60s;
    }
  }
}
