<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Main gradient for the outer hexagon -->
    <linearGradient id="hexGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00E676"/>
      <stop offset="50%" stop-color="#00C853"/>
      <stop offset="100%" stop-color="#009624"/>
    </linearGradient>
    
    <!-- Lighter gradient for inner hexagon -->
    <linearGradient id="hexInnerGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#69F0AE"/>
      <stop offset="50%" stop-color="#00E676"/>
      <stop offset="100%" stop-color="#00C853"/>
    </linearGradient>
    
    <!-- Core sphere gradient -->
    <radialGradient id="sphereGrad" cx="45%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#B9F6CA"/>
      <stop offset="30%" stop-color="#69F0AE"/>
      <stop offset="70%" stop-color="#00E676"/>
      <stop offset="100%" stop-color="#00895a"/>
    </radialGradient>
    
    <!-- Glow effect -->
    <radialGradient id="glowGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00E676" stop-opacity="0.4"/>
      <stop offset="70%" stop-color="#00E676" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#00E676" stop-opacity="0"/>
    </radialGradient>
    
    <!-- Shadow filter -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#00C853" flood-opacity="0.3"/>
    </filter>
    
    <!-- Outer glow filter -->
    <filter id="outerGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="8" result="blur"/>
      <feColorMatrix in="blur" type="matrix" values="0 0 0 0 0  0 0.9 0 0 0  0 0 0.3 0 0  0 0 0 0.35 0" result="glow"/>
      <feMerge>
        <feMergeNode in="glow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Highlight on edges -->
    <linearGradient id="edgeHighlight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>

    <!-- Line gradient -->
    <linearGradient id="lineGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#69F0AE"/>
      <stop offset="100%" stop-color="#00895a"/>
    </linearGradient>

    <!-- Clip path for clean edges -->
    <clipPath id="hexClip">
      <polygon points="256,72 430,172 430,340 256,440 82,340 82,172"/>
    </clipPath>
  </defs>
  
  <!-- Subtle ambient glow -->
  <circle cx="256" cy="256" r="180" fill="url(#glowGrad)"/>
  
  <!-- OUTER HEXAGON - main shape with 3D effect -->
  <g filter="url(#outerGlow)">
    <!-- Back face (darker) -->
    <polygon points="256,82 420,178 420,334 256,430 92,334 92,178" 
             fill="none" stroke="url(#hexGrad)" stroke-width="5" stroke-linejoin="round"/>
    
    <!-- Outer hex fill with slight transparency -->
    <polygon points="256,82 420,178 420,334 256,430 92,334 92,178" 
             fill="#00C853" fill-opacity="0.08"/>
  </g>
  
  <!-- 3D CUBE STRUCTURE - connecting lines from outer to inner hex -->
  <!-- Top-left edge -->
  <line x1="256" y1="82" x2="256" y2="160" stroke="url(#lineGrad)" stroke-width="3" stroke-opacity="0.8"/>
  <!-- Top-right edge -->
  <line x1="420" y1="178" x2="348" y2="218" stroke="url(#lineGrad)" stroke-width="3" stroke-opacity="0.8"/>
  <!-- Bottom-right edge -->
  <line x1="420" y1="334" x2="348" y2="296" stroke="url(#lineGrad)" stroke-width="3" stroke-opacity="0.8"/>
  <!-- Bottom edge -->
  <line x1="256" y1="430" x2="256" y2="352" stroke="url(#lineGrad)" stroke-width="3" stroke-opacity="0.8"/>
  <!-- Bottom-left edge -->
  <line x1="92" y1="334" x2="164" y2="296" stroke="url(#lineGrad)" stroke-width="3" stroke-opacity="0.8"/>
  <!-- Top-left edge -->
  <line x1="92" y1="178" x2="164" y2="218" stroke="url(#lineGrad)" stroke-width="3" stroke-opacity="0.8"/>
  
  <!-- INNER HEXAGON -->
  <polygon points="256,160 348,218 348,296 256,352 164,296 164,218" 
           fill="#00C853" fill-opacity="0.15" stroke="url(#hexInnerGrad)" stroke-width="4" stroke-linejoin="round"/>
  
  <!-- Inner hex top face highlight -->
  <polygon points="256,160 348,218 256,256 164,218" 
           fill="#69F0AE" fill-opacity="0.1"/>
  
  <!-- Inner hex right face -->
  <polygon points="348,218 348,296 256,352 256,256" 
           fill="#00895a" fill-opacity="0.08"/>
  
  <!-- Inner hex left face -->
  <polygon points="164,218 256,256 256,352 164,296" 
           fill="#00C853" fill-opacity="0.06"/>
  
  <!-- CENTER SPHERE / CORE -->
  <circle cx="256" cy="256" r="38" fill="url(#sphereGrad)" filter="url(#shadow)"/>
  
  <!-- Sphere highlight -->
  <ellipse cx="248" cy="246" rx="18" ry="14" fill="white" fill-opacity="0.25"/>
  
  <!-- Sphere inner ring -->
  <circle cx="256" cy="256" r="38" fill="none" stroke="#00E676" stroke-width="1.5" stroke-opacity="0.6"/>
  
  <!-- Small decorative dots at vertices -->
  <circle cx="256" cy="82" r="4" fill="#69F0AE"/>
  <circle cx="420" cy="178" r="4" fill="#69F0AE"/>
  <circle cx="420" cy="334" r="4" fill="#00E676"/>
  <circle cx="256" cy="430" r="4" fill="#00C853"/>
  <circle cx="92" cy="334" r="4" fill="#00C853"/>
  <circle cx="92" cy="178" r="4" fill="#00E676"/>
  
  <!-- Inner hex vertex dots -->
  <circle cx="256" cy="160" r="3" fill="#B9F6CA"/>
  <circle cx="348" cy="218" r="3" fill="#69F0AE"/>
  <circle cx="348" cy="296" r="3" fill="#00E676"/>
  <circle cx="256" cy="352" r="3" fill="#00C853"/>
  <circle cx="164" cy="296" r="3" fill="#00C853"/>
  <circle cx="164" cy="218" r="3" fill="#69F0AE"/>
</svg>
